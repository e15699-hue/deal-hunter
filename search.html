<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搜尋優惠｜好康網</title>
<meta name="description" content="搜尋好康網全部優惠情報">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<a class="brand" href="index.html" aria-label="好康網首頁">
<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 22c0-3.3 2.7-6 6-6h22l16 16-16 16H16c-3.3 0-6-2.7-6-6V22z" fill="#fff"/><circle cx="21" cy="28" r="4.2" fill="#d81b60"/><text x="37.5" y="40.5" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-weight="900" font-size="19" fill="#d81b60">好</text></svg>
<span class="wm"><b>好康網</b><small>HOWKANG.COM.TW</small></span>
</a>
<p class="tagline">站內搜尋・全部優惠情報</p>
</header>
<div class="userbar"><a id="userLink" href="login.html">👤 登入 / 註冊</a></div>
<div class="searchbox"><input id="q" type="search" placeholder="🔍 搜尋優惠：iPhone、面膜、衛生紙…" autocomplete="off"></div>
<div class="chips" id="chips"></div>
<div class="sortbar" id="sortChips"></div>
<div id="searchMeta"></div>
<section class="deal-sec" id="results" style="max-width:680px"></section>
<footer>
<nav class="fnav">
<a href="about.html">關於我們</a><a href="privacy.html">隱私權政策</a><a href="terms.html">服務條款</a><a href="mailto:swiftfixpc@gmail.com">聯絡我們</a>
</nav>
© 2026 好康網 howkang.com.tw・每日自動更新
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script>
let INDEX = [];
const CATS = ["全部","3C數位","家電","美妝保養","服飾鞋包","食品日用","母嬰玩具","運動戶外","居家生活","寵物生活"];
let activeCat = "全部";
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function cardHTML(d){
  const pic = d.img ? `<div class="pic"><img loading="lazy" src="${esc(d.img)}" alt="" onerror="this.closest('.pic').style.display='none'"></div>` : "";
  const key = d.u.split(/[?#]/)[0];
  return `<div class="card"><div class="row">${pic}<div class="body">
  <div class="top"><h3>${esc(d.t)}</h3></div>
  <div class="price"><span class="now">$${d.p.toLocaleString()}</span></div>
  <div class="meta"><span>📦 ${esc(d.s)}</span><span>🏷️ ${esc(d.c)}</span></div>
  <div class="btnrow"><a class="btn" href="${esc(d.u)}" target="_blank" rel="noopener">去看看 →</a>
  <button class="watchbtn" data-key="${esc(key)}" data-title="${esc(d.t)}" data-price="${d.p}" onclick="watchDeal(this)" title="追蹤降價通知">🔔</button></div>
  </div></div></div>`;
}
// ===== 商品排序（與首頁/分類頁共用 localStorage hk_sort） =====
const SORTS = [
  {k:'rec',label:'推薦'},{k:'off',label:'折扣力度'},{k:'plow',label:'價格↑'},
  {k:'phigh',label:'價格↓'},{k:'new',label:'最新上架'}
];
function getSort(){ try{ const v = localStorage.getItem('hk_sort'); if (SORTS.some(s => s.k === v)) return v; }catch(e){} return 'rec'; }
function snum(v){ const n = Number(v); return isFinite(n) ? n : 0; }
function sts(d){ const t = Date.parse(String(d.fa || "").replace(/\//g, "-")); return isFinite(t) ? t : 0; }
function sortHits(hits){
  const mode = getSort(); const a = hits.slice(); if (mode === 'rec') return a;
  const disc = d => { const p = snum(d.p), m = snum(d.m); return m > 0 ? (m - p) / m : -9999; };
  a.sort((x, y) =>
    mode === 'off' ? disc(y) - disc(x) :
    mode === 'plow' ? snum(x.p) - snum(y.p) :
    mode === 'phigh' ? snum(y.p) - snum(x.p) :
    mode === 'new' ? sts(y) - sts(x) : 0);
  return a;
}
function buildSortChips(){
  const el = document.getElementById('sortChips'); if (!el) return;
  const cur = getSort();
  el.innerHTML = '<span class="sortcap">排序</span>' + SORTS.map(s =>
    `<button class="${s.k===cur?'on':''}" data-k="${s.k}">${s.label}</button>`).join("");
  el.querySelectorAll('button').forEach(b => b.onclick = () => {
    try{ localStorage.setItem('hk_sort', b.dataset.k); }catch(e){}
    buildSortChips(); doSearch();
  });
}
function doSearch(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const kw = q.split(/\s+/).filter(Boolean);
  const raw = INDEX.filter(d => {
    if (activeCat !== "全部" && d.c !== activeCat) return false;
    if (!kw.length) return true;
    const hay = (d.t + " " + d.s + " " + d.c).toLowerCase();
    return kw.every(k => hay.includes(k));
  });
  const hits = sortHits(raw);
  document.getElementById('searchMeta').textContent = q || activeCat !== "全部" ? `找到 ${hits.length} 則` : `共 ${hits.length} 則優惠情報`;
  document.getElementById('results').innerHTML = hits.length
    ? "<h2>🔍 搜尋結果</h2>" + hits.map(cardHTML).join("")
    : "<h2>🔍 搜尋結果</h2><div class='card'><div class='body'>沒有找到相關優惠，換個關鍵字試試！</div></div>";
}
function buildChips(){
  document.getElementById('chips').innerHTML = CATS.map(c =>
    `<button class="${c===activeCat?'on':''}" data-c="${c}">${c}</button>`).join("");
  document.querySelectorAll('#chips button').forEach(b => b.onclick = () => {
    activeCat = b.dataset.c; buildChips(); doSearch();
  });
}
fetch('search_index.json').then(r => r.json()).then(j => {
  INDEX = j; buildChips(); buildSortChips();
  const q0 = new URLSearchParams(location.search).get('q');
  if (q0) document.getElementById('q').value = q0;
  doSearch();
});
document.getElementById('q').addEventListener('input', doSearch);
</script>
</body>
</html>
