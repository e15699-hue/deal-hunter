<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="步驟四：為明年省稅做準備">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCE4EC"/><stop offset="1" stop-color="#F8BBD0"/></linearGradient></defs>
<rect width="800" height="450" fill="url(#bg)"/>
<circle cx="700" cy="70" r="34" fill="#F48FB1" opacity="0.55"/>
<circle cx="80" cy="390" r="46" fill="#F48FB1" opacity="0.4"/>
<g transform="translate(140,80)">
<rect x="0" y="0" width="260" height="230" rx="16" fill="#FFFFFF" stroke="#D81B60" stroke-width="6"/>
<rect x="24" y="24" width="212" height="40" rx="8" fill="#D81B60"/>
<text x="130" y="53" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">行事曆提醒</text>
<text x="130" y="120" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="64" font-weight="900" fill="#AD1457">9 / 22</text>
<text x="130" y="170" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="28" font-weight="700" fill="#880E4F">明年開徵 40 日前</text>
<text x="130" y="205" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#6D4C5E">提出自用住宅優惠申請</text>
</g>
<text x="450" y="180" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="64" font-weight="900" fill="#AD1457">明年早點辦</text>
<text x="450" y="240" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="32" font-weight="700" fill="#880E4F">今年 9/22 已過，現在申請</text>
<text x="450" y="290" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="32" font-weight="700" fill="#880E4F">要從明年才開始適用</text>
<text x="450" y="340" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="28" fill="#6D4C5E">已核准且用途未變，免再申請</text>
<rect x="0" y="408" width="800" height="42" fill="#D81B60"/>
<text x="400" y="438" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">步驟 4／4　為明年省稅做準備</text>
</svg>
