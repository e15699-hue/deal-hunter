<text x="400" y="380" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="30" font-weight="700" fill="#AD1457">繳納期限：11 月 1 日～11 月 30 日</text>
