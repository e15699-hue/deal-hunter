<text x="105" y="88" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="26" font-weight="900" fill="#AD1457">2</text>
<rect x="75" y="106" width="60" height="34" rx="8" fill="#F8BBD0"/>
<text x="105" y="132" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="26" font-weight="900" fill="#AD1457">3</text>
<rect x="75" y="150" width="60" height="34" rx="8" fill="#F8BBD0"/>
<text x="105" y="176" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="26" font-weight="900" fill="#AD1457">4</text>
<rect x="75" y="194" width="60" height="24" rx="8" fill="#F8BBD0"/>
<text x="105" y="213" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="900" fill="#AD1457">5</text>
</g>
<text x="400" y="180" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="60" font-weight="900" fill="#AD1457">認 1 級</text>
