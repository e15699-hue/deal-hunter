<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCE4EC"/><stop offset="1" stop-color="#F8BBD0"/></linearGradient></defs>
<rect width="800" height="450" fill="url(#bg)"/>
<circle cx="700" cy="70" r="34" fill="#F48FB1" opacity="0.55"/><circle cx="80" cy="390" r="46" fill="#F48FB1" opacity="0.4"/>
<g transform="translate(130,95)">
<rect x="55" y="0" width="100" height="230" rx="20" fill="#FFFFFF" stroke="#D81B60" stroke-width="6"/>
<rect x="75" y="18" width="60" height="34" rx="8" fill="#D81B60"/>
<text x="105" y="44" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="26" font-weight="900" fill="#FFFFFF">1</text>
