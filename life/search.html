<div class="hero"><h1>🔍 查生活大小事</h1>
<p>輸入你想查的事情，例如「停電」「報價單」「垃圾車」。</p>
<div class="searchbar"><input id="q" type="text" placeholder="想查什麼？"><button id="go">搜尋</button></div>
</div>
<div class="feed" id="res" style="margin-top:16px"></div>
<script>
const PAGES = [{"u": "home/quote.html", "c": "居家裝修", "t": "裝修報價單怎麼看？先搞懂這 5 件事", "k": "報價單 估價 追加工程 付款比例 一式 單價 裝修"}, {"u": "home/designer.html", "c": "居家裝修", "t": "設計師怎麼挑？從丈量到簽約的檢查清單", "k": "設計師 設計費 丈量費 監工費 圖面 裝修"}, {"u": "home/cabinet.html", "c": "居家裝修", "t": "系統櫃怎麼計價？一尺多少錢才合理", "k": "系統櫃 一尺 計價 板材 抽屜 五金 衣櫃"}, {"u": "home/process.html", "c": "居家裝修", "t": "裝修施工流程順序：為什麼不能跳著做", "k": "施工流程 順序 拆除 水電 泥作 木作 油漆 工期 裝修"}, {"u": "home/contract.html", "c": "居家裝修", "t": "裝修合約注意事項：簽下去之前逐條檢查", "k": "合約 保固 驗收 尾款 追加 減帳 裝修"}, {"u": "daily/outage.html", "c": "民生查詢", "t": "停水停電查詢", "k": "停電 停水 台電 台水 計畫性停電 1911 跳電"}, {"u": "daily/vegprice.html", "c": "民生查詢", "t": "菜價行情查詢", "k": "菜價 批發市場 行情 蔬菜 農業部 買菜"}, {"u": "daily/garbage.html", "c": "民生查詢", "t": "垃圾車時間查詢", "k": "垃圾車 清運時間 環保局 倒垃圾 樂圾車"}];
const res = document.getElementById('res');
function run() {
  const q = document.getElementById('q').value.trim();
  const hit = PAGES.filter(p => !q || (p.t + p.k + p.c).includes(q));
  res.innerHTML = hit.length
    ? hit.map(p => '<a class="feeditem" href="' + p.u + '"><span class="tag">' + p.c + '</span><h3>' + p.t + '</h3></a>').join('')
    : '<p>目前站內還沒有這題的整理。先看看<a href="daily/outage.html">停水停電查詢</a>或<a href="home/">居家裝修</a>，或到姊妹站好康網找好康。</p>';
}
const qs = new URLSearchParams(location.search).get('q');
if (qs) { document.getElementById('q').value = qs; }
run();
document.getElementById('go').addEventListener('click', run);
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
</script>
